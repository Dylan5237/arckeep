name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

  windows-package:
    name: windows package
    runs-on: windows-latest
    needs: windows
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer and portable exe
        shell: pwsh
        run: |
          # Push and tag runs leave GITHUB_BASE_REF empty, so electron-builder treats
          # CI as a publish and fails without GH_TOKEN. Pull requests set
          # GITHUB_BASE_REF, which is why this job stayed green until after merge.
          Remove-Item Env:\GITHUB_BASE_REF -ErrorAction SilentlyContinue
          if ($env:GITHUB_BASE_REF) { throw "GITHUB_BASE_REF is still set; push-style packaging was not simulated" }
          npm run dist

      - name: Zip win-unpacked
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/win-unpacked/Arckeep.exe")) {
            throw "dist/win-unpacked/Arckeep.exe was not produced"
          }
          if (-not (Get-ChildItem -LiteralPath "dist" -File -Filter "*portable*.exe")) {
            throw "portable exe was not produced"
          }
          Compress-Archive -Path "dist/win-unpacked" -DestinationPath "dist/arckeep-win-unpacked.zip" -Force

      - name: Packaged fixture startup smoke
        shell: pwsh
        run: ./scripts/smoke-windows-package.ps1

      - name: Bind package checksums to source
        run: node scripts/hash-windows-package.mjs

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: arckeep-windows
          path: |
            dist/*Setup*.exe
            dist/*portable*.exe
            dist/SHA256SUMS.txt
            dist/package-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: arckeep-win-unpacked
          path: dist/arckeep-win-unpacked.zip
          if-no-files-found: error
          retention-days: 14
