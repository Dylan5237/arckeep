<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arckeep</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="nav">
        <div class="brand">
          <img id="brand-mark" class="brand-word" alt="Arckeep" />
          <img id="brand-symbol" class="brand-symbol" alt="" />
        </div>
        <nav id="nav" aria-label="模块">
          <button type="button" data-view="inbox" class="active">等我处理</button>
          <button type="button" data-view="projects">项目总览</button>
          <button type="button" data-view="todos">待办</button>
          <button type="button" data-view="tools">工具架</button>
        </nav>
        <button type="button" id="settings-button" data-view="settings">设置</button>
      </aside>
      <main id="content"></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
